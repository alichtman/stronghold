name: Apply settings on macOS
# Applies Stronghold's settings for real on disposable GitHub-hosted Macs.
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  lockdown:
    strategy:
      fail-fast: false
      matrix:
        # GitHub retires its macOS 14 machines on November 2, 2026. xcode-27 is its macOS 27 image.
        os: [macos-15, macos-26, xcode-27]
        mode: [lockdown, interactive]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install . pexpect
      - run: for d in LanguageModeling Spelling Suggestions; do mkdir -p ~/Library/$d && touch ~/Library/$d/stronghold-test; done
      - run: sqlite3 ~/Library/Preferences/com.apple.LaunchServices.QuarantineEventsV2 "INSERT INTO LSQuarantineEvent (LSQuarantineEventIdentifier) VALUES ('stronghold-test')"
      # No one can type the screen lock password here, so lockdown must say it was not applied.
      - run: |
          stronghold -lockdown < /dev/null | tee lockdown.txt; test "${PIPESTATUS[0]}" = 1
          grep 'sysadminctl -screenLock immediate' lockdown.txt
        if: matrix.mode == 'lockdown'
      - run: cupsctl --share-printers  # So the walk-through has printer sharing to turn off.
        if: matrix.mode == 'interactive'
      - run: sqlite3 ~/Library/Assistant/SiriAnalytics.db 'CREATE TABLE stronghold_test (x)' && touch ~/Library/Assistant/SiriAnalytics.db.backup
        if: matrix.mode == 'interactive'
      - run: python tests/answer-questions.py
        if: matrix.mode == 'interactive'
      - run: tests/check-lockdown.sh ${{ matrix.mode }}
